version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: delivery-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: delivery
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: delivery-api
    restart: unless-stopped
    expose:
      - '3001'
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/delivery?schema=public
      NODE_ENV: production
    depends_on:
      - postgres
    command: >
      sh -c "npx prisma migrate deploy && npx prisma db seed && node dist/main"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: delivery-web
    restart: unless-stopped
    expose:
      - '3000'
    environment:
      NEXT_PUBLIC_API_URL: https://localhost/api
      NEXT_PUBLIC_MERCADO_PAGO_KEY: ''
    depends_on:
      - backend

  nginx:
    image: nginx:alpine
    container_name: delivery-proxy
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - nginx_certs:/etc/nginx/certs
    depends_on:
      - backend
      - frontend

  cert-gen:
    image: alpine:latest
    container_name: delivery-cert-gen
    volumes:
      - nginx_certs:/certs
    command: >
      sh -c "apk add --no-cache openssl && openssl req -x509 -nodes -days 365 -newkey rsa:2048
      -keyout /certs/localhost.key -out /certs/localhost.crt
      -subj '/CN=localhost/O=Delivery/C=BR' && echo 'Certs generated'"
    profiles:
      - setup

volumes:
  postgres_data:
  nginx_certs:
